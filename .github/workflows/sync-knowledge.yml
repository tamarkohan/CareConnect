# Keeps the legal bot's knowledge base up to date with the websites in
# backend/rag/sources.js. Runs every day, and on demand from the Actions tab.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL     Supabase "Session pooler" connection string
#   GEMINI_API_KEY   same key the backend uses
# (The contract encryption key is NOT needed here and should not be added.)

name: Sync legal knowledge base

on:
  schedule:
    - cron: "17 2 * * *"   # every day at 02:17 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: "Only these source ids (space-separated). Empty = all."
        required: false
        default: ""

concurrency:
  group: sync-knowledge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --omit=dev

      - name: Crawl websites and update the database
        # Input passed through env (not inlined) so it can't inject shell code.
        run: npm run sync -- $SOURCES
        env:
          SOURCES: ${{ github.event.inputs.sources }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
